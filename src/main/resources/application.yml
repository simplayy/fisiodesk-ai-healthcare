spring:
  application:
    name: fisiodesk-assistant
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/fisiodesk?directConnection=true}
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:ollama}            # ollama | openai | anthropic | none
      embedding: ${AI_EMBEDDING_PROVIDER:ollama}  # ollama | openai | none
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen3.5:4b}
        think: false
        temperature: 0
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-5-mini}
        temperature: 0
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: ${ANTHROPIC_CHAT_MODEL:claude-haiku-4-5}
        temperature: 0

assistant:
  reference-date: ${REFERENCE_DATE:}
  planner:
    timeout: ${PLANNER_TIMEOUT:1500ms}
    warmup:
      - Mostra pazienti con dolore lombare che hanno mostrato miglioramento negli ultimi 3 mesi ma hanno saltato l'ultimo appuntamento
  enrichment:
    startup-delay: ${ENRICHMENT_STARTUP_DELAY:5s}
    reconcile-interval: ${ENRICHMENT_INTERVAL:60s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    it.fisiodesk: info
    org.mongodb.driver: warn
